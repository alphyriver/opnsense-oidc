name: 🔖 Release Please

# Maintains a release PR from Conventional Commits: it computes the next semver,
# updates CHANGELOG.md, version.txt, and the Makefile PLUGIN_VERSION (via the
# `x-release-please-version` marker). Merging that PR creates the git tag, which
# triggers release.yml (build → sign → publish feed + GitHub Release).
#
# PR creation: works with the default GITHUB_TOKEN as long as
# Settings → Actions → General → "Allow GitHub Actions to create and approve pull
# requests" is enabled. A RELEASE_PLEASE_TOKEN PAT (contents + PR write) is
# optional and only needed for fully hands-off tag→build.
#
# Triggering the signed build: a release tag created here with GITHUB_TOKEN does
# NOT auto-trigger release.yml (GitHub loop-prevention). Either supply the PAT, or
# after merging the release PR run release.yml by hand:
#   gh workflow run release.yml --ref vX.Y.Z   (release.yml has workflow_dispatch)

on:
  push:
    branches: [ main ]
  # Manual re-run. release-please refuses to act while a merged release PR is
  # still labelled `autorelease: pending` ("There are untagged, merged release
  # PRs outstanding - aborting"), and it only reconsiders on a push to main — so
  # once that state is repaired there is no way to make it look again short of
  # an unrelated commit. This repo and opnsense-truenas-api-client both sat
  # stuck that way from 2026-07-11, quietly cutting no releases at all.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
